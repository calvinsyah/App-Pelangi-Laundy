name: Backup Database

on:
  schedule:
    # Run every day at 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gzip

      - name: Dump and Compress Database
        run: |
          timestamp=$(date +"%Y%m%d_%H%M%S")
          filename="pelangi_backup_${timestamp}.sql.gz"
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" | gzip > $filename
          echo "BACKUP_FILENAME=$filename" >> $GITHUB_ENV

      - name: Upload Backup as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ env.BACKUP_FILENAME }}
          path: ${{ env.BACKUP_FILENAME }}
          retention-days: 90
